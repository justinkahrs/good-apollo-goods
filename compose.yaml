services:
  storage:
    image: localstack/localstack:4.7.0
    ports: ["127.0.0.1:19000:4566"]
    environment:
      SERVICES: s3
      PERSISTENCE: 1
    volumes: ["good-apollo-media:/var/lib/localstack"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
volumes:
  good-apollo-media:
